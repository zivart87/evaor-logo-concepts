<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><rect width="400" height="500" fill="#080a10"/><g transform="translate(-62 -215) scale(1.1)"><title id="title">EvaOr — световое кольцо в синих и персиковых оттенках</title>
<defs>
 <filter id="aura" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="39"/></filter>
 <filter id="soft" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="13"/></filter>
 <filter id="diffuse" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="23"/></filter>
 <linearGradient id="edge" x1=".16" y1=".1" x2=".91" y2=".82"><stop stop-color="#ffdbb3"/><stop offset=".32" stop-color="#fff0d7"/><stop offset=".60" stop-color="#ffdbb3"/><stop offset=".83" stop-color="#90b8f8"/><stop offset="1" stop-color="#1a6ce8"/></linearGradient>
 <linearGradient id="inside" x1=".14" y1=".89" x2=".85" y2=".10"><stop stop-color="#05070f"/><stop offset=".45" stop-color="#070c1f"/><stop offset=".76" stop-color="#123c86"/><stop offset="1" stop-color="#1a6ce8"/></linearGradient>
 <radialGradient id="warm"><stop stop-color="#ffad68" stop-opacity=".94"/><stop offset=".40" stop-color="#f28a46" stop-opacity=".78"/><stop offset=".74" stop-color="#c96234" stop-opacity=".31"/><stop offset="1" stop-color="#c96234" stop-opacity="0"/></radialGradient>
 <radialGradient id="blue"><stop stop-color="#1a6ce8" stop-opacity=".88"/><stop offset="1" stop-color="#1a6ce8" stop-opacity="0"/></radialGradient>
 <clipPath id="inner"><circle cx="320" cy="320" r="173"/></clipPath>
 <linearGradient id="soft-edge"><stop stop-color="white"/><stop offset=".5" stop-color="white"/><stop offset="1" stop-color="black"/></linearGradient>
 <mask id="upper"><rect x="0" y="0" width="640" height="640" fill="url(#soft-edge)" transform="rotate(43 320 320)"/></mask>
<linearGradient id="color-edge-mask" x1="0" y1="1" x2="1" y2="0"><stop offset=".32" stop-color="black"/><stop offset=".72" stop-color="white"/></linearGradient><mask id="color-edge"><rect width="640" height="640" fill="url(#color-edge-mask)"/></mask><linearGradient id="dark-edge-mask" x1="0" y1="1" x2="1" y2="0"><stop offset=".32" stop-color="white"/><stop offset=".72" stop-color="black"/></linearGradient><mask id="dark-edge"><rect width="640" height="640" fill="url(#dark-edge-mask)"/></mask><radialGradient id="lower-orange"><stop stop-color="#f79855" stop-opacity=".82"/><stop offset=".45" stop-color="#ef8748" stop-opacity=".48"/><stop offset="1" stop-color="#ef8748" stop-opacity="0"/></radialGradient></defs>

<!-- Broad cool halo; warm core remains distinctly brighter. -->
<circle cx="320" cy="320" r="211" fill="none" stroke="#1a6ce8" stroke-width="101" opacity=".64" filter="url(#aura)"/>
<circle cx="320" cy="320" r="194" fill="none" stroke="url(#edge)" stroke-width="48" filter="url(#soft)"/>
<circle cx="320" cy="320" r="190" fill="none" stroke="url(#edge)" stroke-width="24" opacity=".80" filter="url(#soft)"/>
<ellipse cx="300" cy="504" rx="142" ry="62" fill="url(#lower-orange)" filter="url(#soft)"/>
<!-- A precise dark silhouette is visible at the lower left. --><g mask="url(#dark-edge)">
<circle cx="320" cy="320" r="173" fill="url(#inside)"/>
<g clip-path="url(#inner)">
 <ellipse cx="268" cy="223" rx="153" ry="148" fill="url(#warm)" filter="url(#diffuse)"/>
 <ellipse cx="446" cy="261" rx="141" ry="185" fill="url(#blue)" filter="url(#diffuse)"/>
</g>
</g><!-- A softened copy dissolves the bright part of the silhouette, preserving the dark edge. -->
<g mask="url(#color-edge)"><g filter="url(#soft)"><circle cx="320" cy="320" r="173" fill="url(#inside)"/><g clip-path="url(#inner)"><ellipse cx="268" cy="223" rx="153" ry="148" fill="url(#warm)" filter="url(#diffuse)"/><ellipse cx="446" cy="261" rx="141" ry="185" fill="url(#blue)" filter="url(#diffuse)"/></g></g></g>
<!-- Only the illuminated edge spills softly into the interior. -->
<circle cx="320" cy="320" r="183" fill="none" stroke="url(#edge)" stroke-width="18" opacity=".65" filter="url(#soft)" mask="url(#upper)"/>
</g></svg>